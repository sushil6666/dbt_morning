name: dbt CD

# ─── Trigger ──────────────────────────────────────────────────────────────────
# Run manually from the GitHub Actions UI.
# MUST be triggered from the main branch — all three stages always deploy main.
# Pick the stage you want to promote TO — each stage is independent so you can
# re-run a single stage without re-running the ones before it.
#
#   main ──┬──► UAT       (stage: uat)       full build + test in DBT_BATCH_UAT
#           ├──► Candidate (stage: candidate) WAP Write + Audit in DBT_BATCH_CANDIDATE
#           └──► Prod      (stage: prod)      WAP Publish via swap_schemas
#
# Triggering from any branch other than main causes all jobs to be skipped.
# Prod requires a GitHub Environment named "production" — add required reviewers
# there (repo Settings → Environments → production) to enforce an approval gate.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy'
        required: true
        type: choice
        options:
          - uat          # dev → UAT     : full build + test in DBT_BATCH_UAT
          - candidate    # UAT → Candidate: WAP Write + Audit in DBT_BATCH_CANDIDATE
          - prod         # Candidate → Prod: WAP Publish via swap_schemas
        default: uat

# Never cancel a running deployment — always let it finish.
concurrency:
  group: dbt-cd-${{ inputs.stage }}
  cancel-in-progress: false

permissions:
  contents: read
  actions:  read

env:
  DBT_PROFILES_DIR:    ${{ github.workspace }}/ci
  SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

# ─── Shared setup steps (referenced by all jobs) ──────────────────────────────
# GitHub Actions doesn't support YAML anchors, so the install steps are repeated
# per job — but kept short (3 steps each) to stay readable.

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 1 — dev → UAT
  # Full seed + run + test cycle against DBT_BATCH_UAT.
  # Validates the branch is shippable before it touches any candidate/prod data.
  # ════════════════════════════════════════════════════════════════════════════
  deploy-uat:
    name: "Stage 1 — Deploy → UAT"
    if: github.ref == 'refs/heads/main' && inputs.stage == 'uat'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: uat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt-snowflake
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps

      - name: dbt seed → UAT
        run: dbt seed --target uat

      - name: dbt run → UAT
        run: dbt run --target uat --exclude "tag:elementary-tests"

      - name: dbt test → UAT
        run: dbt test --target uat --exclude "tag:elementary-tests"

      - name: Parse and display test results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from collections import defaultdict

          summary_file = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              results = json.load(open("target/run_results.json"))["results"]
          except Exception as e:
              open(summary_file, "a").write(f"\n_Could not parse run results: {e}_\n")
              exit(0)

          tests  = defaultdict(list)
          models = defaultdict(list)
          for r in results:
              rt = r.get("resource_type", "")
              st = r.get("status", "unknown")
              nm = r.get("name", "unknown")
              if rt == "test":  tests[st].append(nm)
              elif rt == "model": models[st].append(nm)

          lines = [
              "\n## UAT Deployment — Test Results\n",
              f"**Branch:** `{os.environ.get('GITHUB_REF_NAME', 'unknown')}`  "
              f"**Schema:** `DBT_BATCH_UAT`\n",
              "| Metric | Count |", "|---|---|",
              f"| Tests passed  | {len(tests.get('pass', []) + tests.get('success', []))} |",
              f"| Tests failed  | {len(tests.get('fail', []) + tests.get('error', []))} |",
              f"| Models built  | {len(models.get('success', []))} |",
              f"| Models failed | {len(models.get('fail', []) + models.get('error', []))} |",
          ]
          if tests.get("fail") or tests.get("error"):
              lines.append("\n### ❌ Failed Tests\n")
              for t in tests.get("fail", []) + tests.get("error", []):
                  lines.append(f"- {t}")
          open(summary_file, "a").write("\n".join(lines) + "\n")
          PY

      - name: Deployment summary
        if: success()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **UAT deployment complete.** Next step: run this workflow with \`stage: candidate\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M UTC') by \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"


  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 2 — UAT → Candidate   (WAP: Write + Audit)
  #
  # Write  → dbt run  --target candidate   builds into DBT_BATCH_CANDIDATE
  # Audit  → dbt test --target candidate   validates every test
  #
  # Prod is completely untouched during this stage.
  # If tests fail the job fails here — swap_schemas is never called.
  # ════════════════════════════════════════════════════════════════════════════
  deploy-candidate:
    name: "Stage 2 — WAP Write + Audit → Candidate"
    if: github.ref == 'refs/heads/main' && inputs.stage == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: candidate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt-snowflake
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps

      - name: "WAP — Write: dbt seed → candidate"
        run: dbt seed --target candidate

      - name: "WAP — Write: dbt run → candidate"
        run: |
          echo "## WAP Step 1 — Write" >> "$GITHUB_STEP_SUMMARY"
          echo "Building all models into \`DBT_BATCH_CANDIDATE\`. Prod is untouched." >> "$GITHUB_STEP_SUMMARY"
          dbt run --target candidate --exclude "tag:elementary-tests"

      - name: "WAP — Audit: dbt test → candidate"
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## WAP Step 2 — Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Running all tests against \`DBT_BATCH_CANDIDATE\`. Prod promoted only if this passes." >> "$GITHUB_STEP_SUMMARY"
          dbt test --target candidate --exclude "tag:elementary-tests"

      - name: Parse and display test results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from collections import defaultdict

          summary_file = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              results = json.load(open("target/run_results.json"))["results"]
          except Exception as e:
              open(summary_file, "a").write(f"\n_Could not parse run results: {e}_\n")
              exit(0)

          tests  = defaultdict(list)
          models = defaultdict(list)
          for r in results:
              rt = r.get("resource_type", "")
              st = r.get("status", "unknown")
              nm = r.get("name", "unknown")
              if rt == "test":  tests[st].append(nm)
              elif rt == "model": models[st].append(nm)

          passed = len(tests.get("pass", []) + tests.get("success", []))
          failed = len(tests.get("fail", []) + tests.get("error", []))
          lines  = [
              "\n## WAP Audit — Test Results\n",
              "| Metric | Count |", "|---|---|",
              f"| Tests passed  | {passed} |",
              f"| Tests failed  | {failed} |",
              f"| Models built  | {len(models.get('success', []))} |",
              f"| Models failed | {len(models.get('fail', []) + models.get('error', []))} |",
          ]
          if tests.get("fail") or tests.get("error"):
              lines.append("\n### ❌ Failed Tests — Prod will NOT be promoted\n")
              for t in tests.get("fail", []) + tests.get("error", []):
                  lines.append(f"- {t}")
          else:
              lines.append(
                  f"\n✅ **All {passed} tests passed.** "
                  "Candidate is ready. Run this workflow with `stage: prod` to publish."
              )
          open(summary_file, "a").write("\n".join(lines) + "\n")
          PY


  # ════════════════════════════════════════════════════════════════════════════
  # STAGE 3 — Candidate → Prod   (WAP: Publish)
  #
  # Calls swap_schemas to rename:
  #   DBT_BATCH_PROD      → DBT_BATCH_PROD_BACKUP   (safety copy)
  #   DBT_BATCH_CANDIDATE → DBT_BATCH_PROD           (publish — metadata rename)
  #
  # All Snowflake RENAME SCHEMA operations are metadata-only.
  # BI tools see an uninterrupted, consistent prod schema throughout.
  #
  # Set up required reviewers on the "production" GitHub Environment
  # (repo Settings → Environments → production) to enforce a human approval gate.
  # ════════════════════════════════════════════════════════════════════════════
  deploy-prod:
    name: "Stage 3 — WAP Publish → Prod (swap_schemas)"
    if: github.ref == 'refs/heads/main' && inputs.stage == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt-snowflake
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps

      - name: "WAP — Publish: swap_schemas candidate → prod"
        run: |
          echo "## WAP Step 3 — Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "Swapping \`DBT_BATCH_CANDIDATE\` → \`DBT_BATCH_PROD\` (Snowflake metadata rename — no data copied)" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous prod retained as \`DBT_BATCH_PROD_BACKUP\` for rollback." >> "$GITHUB_STEP_SUMMARY"
          dbt run-operation swap_schemas \
            --args '{"candidate_schema": "DBT_BATCH_CANDIDATE", "prod_schema": "DBT_BATCH_PROD", "keep_backup": true}' \
            --target prod

      - name: Deployment summary
        if: success()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Prod deployment complete.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployed at  | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployed by  | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch       | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prod schema  | \`DBT_BATCH_PROD\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback available | \`DBT_BATCH_PROD_BACKUP\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback hint on failure
        if: failure()
        run: |
          echo "## ⚠️ Publish failed — how to rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If the rename of prod → backup succeeded before the failure, \`DBT_BATCH_PROD_BACKUP\` exists. To restore:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'dbt run-operation swap_schemas \' >> "$GITHUB_STEP_SUMMARY"
          echo '  --args '"'"'{"candidate_schema": "DBT_BATCH_PROD_BACKUP", "prod_schema": "DBT_BATCH_PROD", "keep_backup": false}'"'"' \' >> "$GITHUB_STEP_SUMMARY"
          echo '  --target prod' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "If \`DBT_BATCH_PROD\` was never renamed (failure before step 2), no rollback is needed — prod is untouched." >> "$GITHUB_STEP_SUMMARY"
