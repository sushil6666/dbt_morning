name: dbt CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions:  read

env:
  DBT_PROFILES_DIR:    ${{ github.workspace }}/ci
  SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

jobs:
  dbt-build:
    name: dbt build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dbt-snowflake
        run: pip install -r requirements.txt

      - name: dbt deps
        run: dbt deps

      - name: Download production manifest
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          name: production-manifest
          workflow: ci.yml
          branch: main
          path: ./production-manifest/

      - name: dbt build — changed models + downstream (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f ./production-manifest/manifest.json ]; then
            echo "## Slim CI — \`state:modified+\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Only models changed in this PR and their downstream dependents are built." >> "$GITHUB_STEP_SUMMARY"
            dbt build \
              --select "state:modified+" \
              --exclude "tag:elementary-tests" \
              --defer \
              --state ./production-manifest/ \
              --threads 4
          else
            echo "## Full build — no production manifest found yet" >> "$GITHUB_STEP_SUMMARY"
            dbt build --exclude "tag:elementary-tests"
          fi

      - name: dbt build — full (main)
        if: github.event_name == 'push'
        run: |
          echo "## Full build — post-merge to main" >> "$GITHUB_STEP_SUMMARY"
          dbt build --exclude "tag:elementary-tests"

      - name: Parse and display test results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import defaultdict

          summary_file = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              results = json.load(open("target/run_results.json"))["results"]
          except Exception as e:
              print(f"Warning: Could not parse results: {e}")
              exit(0)

          tests = defaultdict(list)
          models = defaultdict(list)

          for r in results:
              resource_type = r.get("resource_type", "")
              status = r.get("status", "unknown")
              name = r.get("name", "unknown")
              node_path = r.get("unique_id", "")

              if resource_type == "test":
                  tests[status].append({"name": name, "path": node_path})
              elif resource_type == "model":
                  models[status].append({"name": name, "path": node_path})

          lines = ["\n## 📊 Test Execution Summary\n"]

          total_tests = sum(len(v) for v in tests.values())
          total_models = sum(len(v) for v in models.values())
          failed_tests = len(tests.get("fail", [])) + len(tests.get("error", []))
          failed_models = len(models.get("fail", [])) + len(models.get("error", []))

          lines.append("\n### Overall Counts\n")
          lines.append("| Metric | Count |")
          lines.append("|---|---|")
          lines.append(f"| Total Tests | {total_tests} |")
          lines.append(f"| Failed Tests | {failed_tests} |")
          lines.append(f"| Total Models | {total_models} |")
          lines.append(f"| Failed Models | {failed_models} |")

          if tests:
              lines.append("\n### Test Results\n")
              
              if tests.get("pass") or tests.get("success"):
                  passed = len(tests.get("pass", [])) + len(tests.get("success", []))
                  lines.append(f"✅ **Passed Tests** ({passed})\n")
                  for test in (tests.get("pass", []) + tests.get("success", []))[:20]:
                      lines.append(f"  - {test['name']}")
                  if passed > 20:
                      lines.append(f"  - ... and {passed - 20} more")
                  lines.append("")
              
              if tests.get("fail") or tests.get("error"):
                  failed = len(tests.get("fail", [])) + len(tests.get("error", []))
                  lines.append(f"❌ **Failed Tests** ({failed})\n")
                  for test in tests.get("fail", []) + tests.get("error", []):
                      lines.append(f"  - {test['name']}")
                  lines.append("")

          if models:
              lines.append("\n### Model Build Results\n")
              
              if models.get("success"):
                  lines.append(f"✅ **Successful Models** ({len(models.get('success', []))})\n")
                  lines.append("")
              
              if models.get("fail") or models.get("error"):
                  failed = len(models.get("fail", [])) + len(models.get("error", []))
                  lines.append(f"❌ **Failed Models** ({failed})\n")
                  for model in models.get("fail", []) + models.get("error", []):
                      lines.append(f"  - {model['name']}")
                  lines.append("")

          with open(summary_file, "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Write build summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os

          summary_file = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              results = json.load(open("target/run_results.json"))["results"]
              from collections import Counter
              counts = Counter(r["status"] for r in results)
              lines = ["\n### Status Counts\n", "| Status | Count |", "|---|---|"]
              for status in ["pass", "success", "warn", "error", "fail", "skipped"]:
                  if status in counts:
                      lines.append(f"| {status} | {counts[status]} |")
              with open(summary_file, "a") as f:
                  f.write("\n".join(lines) + "\n")
          except Exception as e:
              with open(summary_file, "a") as f:
                  f.write(f"\n_Could not parse run results: {e}_\n")
          PY

      - name: Upload production manifest
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: production-manifest
          path: target/manifest.json
          retention-days: 90
