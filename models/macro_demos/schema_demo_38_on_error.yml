version: 2

# ---------------------------------------------------------------------------
# schema_demo_38_on_error.yml
# ---------------------------------------------------------------------------
# Demonstrates on_error: continue (dbt Core 1.12 beta).
#
# KNOWN LIMITATION — dbt-fusion (dbt1701):
#   on_error='continue' is not yet supported in dbt Fusion. The config is
#   kept in place and will activate automatically once Fusion ships support.
#   Until then, Fusion falls back to skip_children (default behaviour).
#
# DAG:
#   demo_38_on_error_continue_upstream   ->   demo_38_on_error_continue_downstream
#
# Expected result on dbt Core 1.12+ (not yet on Fusion):
#   dbt build --select demo_38_on_error_continue_upstream+
#   - upstream errors intentionally (division-by-zero)
#   - downstream STILL RUNS because upstream uses on_error: continue
#
# Current result on dbt-fusion:
#   - upstream errors
#   - downstream is SKIPPED (skip_children fallback, dbt1701 warning emitted)
# ---------------------------------------------------------------------------

models:
  - name: demo_38_on_error_continue_upstream
    description: >
      Intentionally failing parent model used to demonstrate `on_error: continue`.
      The model errors at execution time, but dbt keeps scheduling downstream
      children instead of skipping them.
    config:
      materialized: table
      on_error: continue
      tags: ['macro_demo', 'demo_38', 'on_error', 'continue']
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_type: varchar
      - name: force_failure
        description: Intentionally invalid numeric expression that forces runtime failure.
        data_type: number

  - name: demo_38_on_error_continue_downstream
    description: >
      Child model that still runs after the parent fails. The DAG dependency is
      explicit, but the SQL reads from dim_customers instead of the failed parent
      relation so the run can continue successfully.
    config:
      materialized: table
      tags: ['macro_demo', 'demo_38', 'on_error', 'continue']
    columns:
      - name: customer_count
        description: Row count of dim_customers used to prove the child executed.
        data_type: number
      - name: demo_ran_at
        description: Timestamp when the downstream demo model executed.
        data_type: timestamp_ntz
