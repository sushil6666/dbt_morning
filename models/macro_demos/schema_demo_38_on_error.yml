version: 2

# ---------------------------------------------------------------------------
# schema_demo_38_on_error.yml
# ---------------------------------------------------------------------------
# Documents the current dbt Fusion limitation for on_error: continue.
#
# DAG:
#   demo_38_on_error_continue_upstream   ->   demo_38_on_error_continue_downstream
#
# Actual result in this Fusion environment when you run:
#   dbt build --select demo_38_on_error_continue_upstream+
#
#   - parse emits a warning that on_error: continue is not yet supported
#   - upstream model errors intentionally
#   - downstream model is still skipped
#   - effective behavior matches the default skip_children semantics
# ---------------------------------------------------------------------------

models:
  - name: demo_38_on_error_continue_upstream
    description: >
      Intentionally failing parent model used to document a current Fusion
      limitation. The model sets `on_error: continue`, but Fusion warns that the
      option is not yet supported and still skips downstream children after the
      parent fails.
    config:
      materialized: table
      on_error: continue
      tags: ['macro_demo', 'demo_38', 'on_error', 'continue', 'fusion_limitation']
    columns:
      - name: customer_id
        description: Customer identifier from dim_customers.
        data_type: varchar
      - name: force_failure
        description: Intentionally invalid numeric expression that forces runtime failure.
        data_type: number

  - name: demo_38_on_error_continue_downstream
    description: >
      Child model retained to prove the limitation in practice. Even with a DAG
      dependency and an upstream parent configured with `on_error: continue`,
      this child is skipped after the parent fails in the current Fusion runtime.
    config:
      materialized: table
      tags: ['macro_demo', 'demo_38', 'on_error', 'continue', 'fusion_limitation']
    columns:
      - name: customer_count
        description: Row count of dim_customers used to show what this child would build.
        data_type: number
      - name: demo_ran_at
        description: Timestamp the downstream model would write if it were allowed to run.
        data_type: timestamp_ntz
