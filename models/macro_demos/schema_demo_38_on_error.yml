version: 2

# ---------------------------------------------------------------------------
# schema_demo_38_on_error.yml
# ---------------------------------------------------------------------------
# Documents the current dbt Fusion limitation for on_error: continue.
#
# KNOWN LIMITATION — dbt-fusion (dbt1701):
#   on_error='continue' is not yet supported in dbt Fusion.
#
# CURRENT PROJECT STATE:
#   Both demo_38 models are disabled so normal builds do not execute an
#   intentionally failing demo. The unsupported config is not set in this file,
#   so the project stays warning-free under Fusion while the descriptions still
#   document the current limitation.
#
# DAG:
#   demo_38_on_error_continue_upstream   ->   demo_38_on_error_continue_downstream
#
# Historical result in this Fusion environment when you run the demo with
# on_error: continue configured:
#   dbt build --select demo_38_on_error_continue_upstream+
#   - parse emits a warning that on_error: continue is not yet supported
#   - upstream model errors intentionally
#   - downstream model is still skipped
#   - effective behavior matches the default skip_children semantics
# ---------------------------------------------------------------------------

models:
  - name: demo_38_on_error_continue_upstream
    description: >
      Documents the current dbt Fusion limitation around `on_error: continue`.
      This demo is disabled in normal project runs because it fails
      intentionally at execution time with division by zero. If re-enabled and
      configured with `on_error: continue`, it shows that Fusion currently
      warns that the option is not yet supported and still skips downstream
      children in practice.
    config:
      enabled: false
      materialized: table
      tags: ['macro_demo', 'demo_38', 'on_error', 'continue', 'fusion_limitation']
    columns:
      - name: customer_id
        description: Customer identifier from `dim_customers`.
        data_type: varchar
      - name: force_failure
        description: Intentionally invalid numeric expression that forces runtime failure.
        data_type: number

  - name: demo_38_on_error_continue_downstream
    description: >
      Downstream child retained specifically to prove current Fusion behavior.
      This model is disabled alongside the upstream demo so normal builds do not
      depend on an intentionally failing example. If re-enabled, it shows that
      a child is still skipped after the parent fails in the current Fusion runtime.
    config:
      enabled: false
      materialized: table
      tags: ['macro_demo', 'demo_38', 'on_error', 'continue', 'fusion_limitation']
    columns:
      - name: customer_count
        description: Row count of `dim_customers` used to show what this child would build.
        data_type: number
      - name: demo_ran_at
        description: Timestamp the downstream model would write if it were allowed to run.
        data_type: timestamp_ntz
