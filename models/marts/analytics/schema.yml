version: 2

models:

  - name: agg_daily_revenue
    description: >
      Daily revenue breakdown across all park revenue streams, enriched with calendar
      attributes from `dim_dates`. One row per calendar date in the range 2024-01-01
      to CURRENT_DATE(). Grain is `date_day`.

      Dates with no park activity still appear (from the `dim_dates` LEFT JOIN) with
      all revenue and visitor columns coalesced to 0. This enables continuous time-series
      analysis without gaps.
    columns:
      - name: date_day
        description: >-
          Calendar date. Primary key of this model. Range 2024-01-01 to CURRENT_DATE().
        data_tests:
          - unique
          - not_null
      - name: day_of_week
        description: Day name (e.g. 'Monday', 'Saturday'). From `dim_dates`.
      - name: month_name
        description: Month name (e.g. 'January', 'October'). From `dim_dates`.
      - name: quarter
        description: Calendar quarter (1–4). From `dim_dates`.
      - name: year
        description: Calendar year (e.g. 2024). From `dim_dates`.
      - name: is_weekend
        description: Boolean. TRUE for Saturday and Sunday.
      - name: ticket_revenue
        description: Additive measure. Sum of ticket `final_price` values for visits on this date.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: in_park_revenue
        description: Additive measure. Sum of all POS `total_amount` values for this date.
        data_tests:
          - not_null
      - name: food_revenue
        description: Additive measure. Subset of `in_park_revenue` where `category = 'food'`.
        data_tests:
          - not_null
      - name: merch_revenue
        description: Additive measure. Subset of `in_park_revenue` where `category = 'merchandise'`.
        data_tests:
          - not_null
      - name: total_revenue
        description: Additive measure. `ticket_revenue + in_park_revenue`.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: unique_visitors
        description: Count of distinct customers who purchased a ticket for this visit date.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: tickets_sold
        description: Total number of ticket records for this visit date.
        data_tests:
          - not_null
      - name: revenue_per_visitor
        description: Non-additive measure derived from total_revenue and unique_visitors.
        data_tests:
          - not_null

  - name: agg_customer_lifetime_value
    description: Customer lifetime value aggregated by loyalty tier and customer value segment.
    columns:
      - name: loyalty_tier
        description: Customer loyalty tier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Gold', 'Silver', 'Bronze']
      - name: customer_value_segment
        description: Combined value segment.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High Value', 'Mid Value', 'Standard']
      - name: total_customers
        description: Count of distinct customers in this segment combination.
        data_tests:
          - not_null
      - name: avg_lifetime_spend
        description: Average total ticket spend per customer in this segment.
        data_tests:
          - not_null
      - name: avg_visits
        description: Average number of ticket purchases per customer in this segment.
        data_tests:
          - not_null
      - name: avg_spend_per_visit
        description: Average ticket price per visit per customer in this segment.
        data_tests:
          - not_null
      - name: total_segment_revenue
        description: Sum of lifetime ticket spend across all customers in this segment.
        data_tests:
          - not_null
      - name: clv
        description: Customer Lifetime Value for this segment.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0


  - name: customer_revenue_retention_summary
    description: >
      Stakeholder-facing customer value mart with one row per `customer_id`.
      It combines customer attributes with observed visit behavior so CRM, finance,
      and park leadership can identify high-value guests, recent/lapsed guests, and
      customers whose purchase behavior suggests upsell or retention opportunities.

      This model uses actual visit facts for revenue and recency. In the current seed-backed
      dataset, each customer has one recorded visit and no POS transactions match visits on
      `(customer_id, visit_date)`, so repeat-visit behavior is limited and `lifetime_in_park_revenue`
      is currently 0 across the board.
    columns:
      - name: customer_id
        description: Customer primary key. Grain of this model is one row per customer.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: first_name
        description: Customer first name from `dim_customers`.
      - name: last_name
        description: Customer last name from `dim_customers`.
      - name: email
        description: Customer email from `dim_customers`.
      - name: registration_date
        description: Date the customer account was created.
      - name: loyalty_tier
        description: Loyalty tier inherited from `dim_customers`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Gold', 'Silver', 'Bronze']
      - name: customer_value_segment
        description: Existing customer segment from `dim_customers`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High Value', 'Mid Value', 'Standard']
      - name: customer_lifecycle_stage
        description: Lifecycle stage inherited from `dim_customers`.
      - name: total_visits
        description: Count of ticketed visits recorded for the customer.
        data_tests:
          - not_null
      - name: first_visit_date
        description: First recorded park visit date for the customer.
        data_tests:
          - not_null
      - name: most_recent_visit_date
        description: Most recent recorded park visit date for the customer.
        data_tests:
          - not_null
      - name: days_since_last_visit
        description: Days between the customer's most recent visit and today.
        data_tests:
          - not_null
      - name: lifetime_ticket_revenue
        description: Total ticket revenue across the customer's visits.
        data_tests:
          - not_null
      - name: lifetime_in_park_spend
        description: Total matched in-park spend across the customer's visits.
        data_tests:
          - not_null
      - name: lifetime_total_spend
        description: Total customer spend across ticket and matched POS revenue.
        data_tests:
          - not_null
      - name: avg_spend_per_visit
        description: Average total spend per recorded visit.
        data_tests:
          - not_null
      - name: avg_visit_rating
        description: Average visit satisfaction rating when the customer submitted feedback.
      - name: feedback_submissions
        description: Count of matched feedback submissions across all visits.
        data_tests:
          - not_null
      - name: discounted_visit_count
        description: Number of visits where the ticket was discounted.
        data_tests:
          - not_null
      - name: same_day_visit_count
        description: Number of visits purchased on the same day as the visit.
        data_tests:
          - not_null
      - name: advance_purchase_visit_count
        description: Number of visits purchased at least 7 days in advance.
        data_tests:
          - not_null
      - name: avg_booking_lead_days
        description: Average days between purchase and visit date.
      - name: is_repeat_visitor
        description: TRUE when the customer has more than one recorded visit.
        data_tests:
          - not_null
      - name: behavioral_value_segment
        description: Spend-based customer segment derived from observed lifetime spend.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High Value', 'Mid Value', 'Standard']
      - name: recency_segment
        description: Recency bucket derived from days since last visit.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Cooling', 'Lapsed']
      - name: retention_risk_level
        description: Retention risk proxy derived from customer recency.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']

  - name: agg_ride_popularity
    description: >
      Ride popularity and satisfaction summary with one row per `ride_id`.
      This model combines review volume, satisfaction, and wait-time context so rides can
      be segmented into useful business groupings instead of being ranked only by raw review count.
    columns:
      - name: ride_key
        description: Surrogate PK from `dim_rides`.
        data_tests:
          - unique
          - not_null
      - name: ride_id
        description: Natural key from `raw_rides`.
        data_tests:
          - unique
          - not_null
      - name: ride_name
        description: Display name of the ride.
        data_tests:
          - not_null
      - name: ride_type
        description: Physical ride category.
      - name: thrill_level
        description: Operations-assigned thrill intensity.
      - name: zone
        description: Park zone where the ride is located.
      - name: is_haunted
        description: TRUE for haunted rides.
      - name: status
        description: Current ride operating status.
      - name: capacity_per_hour
        description: Maximum riders per hour.
      - name: avg_wait_minutes
        description: Rolling average queue wait time in minutes.
      - name: total_reviews
        description: Lifetime count of ride feedback records.
      - name: avg_rating
        description: Lifetime average satisfaction rating.
      - name: positive_review_pct
        description: Percentage of positive reviews.
      - name: has_reviews
        description: TRUE when the ride has at least one review.
        data_tests:
          - not_null
      - name: review_count_band
        description: Review volume band based on `total_reviews`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Reviews', 'Single Review', 'Low Volume', 'Established']
      - name: rating_tier
        description: Categorical satisfaction band derived from `avg_rating`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Top Rated', 'Well Rated', 'Average', 'Below Average', 'Not Yet Rated']
      - name: popularity_segment
        description: Review-volume segment for the ride.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Proven Favorite', 'Emerging Interest', 'Needs Awareness']
      - name: wait_experience_segment
        description: Combined wait-time and satisfaction segment.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High Wait / Low Satisfaction', 'High Wait / Strong Satisfaction', 'Low Wait / Strong Satisfaction', 'No Feedback Yet', 'Monitor']
      - name: review_volume_rank
        description: Rank by review volume, then rating.
        data_tests:
          - not_null
      - name: rating_rank
        description: Rank by rating, then review volume.
        data_tests:
          - not_null

  - name: ride_satisfaction_opportunities
    description: >
      Stakeholder-facing ride performance mart with one row per `ride_id`.
      It highlights which rides should be promoted, monitored, or investigated based on
      guest satisfaction, review coverage, and queue wait context.
    columns:
      - name: ride_key
        description: Surrogate ride key from `agg_ride_popularity`.
        data_tests:
          - unique
          - not_null
      - name: ride_id
        description: Natural ride identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rides')
                field: ride_id
      - name: ride_name
        description: Display name of the ride.
        data_tests:
          - not_null
      - name: ride_type
        description: Physical ride category.
      - name: thrill_level
        description: Operations-assigned thrill intensity.
      - name: zone
        description: Park zone where the ride is located.
      - name: is_haunted
        description: Haunted ride flag.
      - name: status
        description: Current ride operating status.
      - name: capacity_per_hour
        description: Maximum riders per hour.
      - name: avg_wait_minutes
        description: Rolling average queue wait time in minutes.
      - name: total_reviews
        description: Number of ride reviews captured for the attraction.
        data_tests:
          - not_null
      - name: avg_rating
        description: Average ride satisfaction rating.
        data_tests:
          - not_null
      - name: positive_review_pct
        description: Percentage of positive ride reviews.
        data_tests:
          - not_null
      - name: review_count_band
        description: Review volume band inherited from `agg_ride_popularity`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Reviews', 'Single Review', 'Low Volume', 'Established']
      - name: rating_tier
        description: Satisfaction tier inherited from `agg_ride_popularity`.
        data_tests:
          - not_null
      - name: popularity_segment
        description: Review-volume segment inherited from `agg_ride_popularity`.
        data_tests:
          - not_null
      - name: wait_experience_segment
        description: Combined wait-time and satisfaction segment.
        data_tests:
          - not_null
      - name: recommended_action
        description: Recommended stakeholder action based on ride performance.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Collect More Feedback', 'Improve Guest Experience', 'Promote Ride', 'Build Awareness', 'Monitor Performance']
      - name: action_priority
        description: Priority level for the recommended action.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']


  - name: agg_fear_vs_ratings
    description: Analysis of whether higher fear levels correlate with visitor satisfaction.
    columns:
      - name: visitor_type
        description: Feedback category used as visitor type proxy.
        data_tests:
          - not_null
      - name: fear_level
        description: Haunted house fear intensity.
        data_tests:
          - not_null
      - name: avg_satisfaction
        description: Average satisfaction rating.
        data_tests:
          - not_null
      - name: total_visits
        description: Count of feedback records for this grouping.
        data_tests:
          - not_null

  - name: agg_halloween_spending
    description: Ticket spending patterns relative to Halloween.
    columns:
      - name: date_bucket
        description: Halloween proximity label.
        data_tests:
          - unique
          - not_null
      - name: total_tickets
        description: Count of ticket sale records in this date bucket.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of ticket prices for visits in this date bucket.
        data_tests:
          - not_null
      - name: avg_ticket_price
        description: Average ticket price for visits in this date bucket.
        data_tests:
          - not_null
      - name: avg_discount_pct
        description: Average discount percentage applied to tickets in this bucket.
        data_tests:
          - not_null
      - name: spend_tier
        description: Spend tier derived from `avg_ticket_price`.
        data_tests:
          - not_null

  - name: agg_happiest_houses
    description: Ranking of haunted houses by visitor satisfaction.
    columns:
      - name: haunted_house_name
        description: Display name of the haunted house.
        data_tests:
          - unique
          - not_null
      - name: total_visits
        description: Count of feedback records for this house at or above the threshold.
        data_tests:
          - not_null
      - name: avg_satisfaction
        description: Average satisfaction rating for filtered feedback records.
        data_tests:
          - not_null
      - name: recommendation_rate
        description: Percentage of visitors who would recommend this house.
        data_tests:
          - not_null
      - name: happiness_rank
        description: Rank by avg_satisfaction descending.
        data_tests:
          - not_null

  - name: agg_house_profitability_by_time
    description: Haunted house revenue and satisfaction by time slot.
    columns:
      - name: haunted_house_name
        description: Display name of the haunted house.
        data_tests:
          - not_null
      - name: visit_hour
        description: Hour of the park visit.
      - name: time_slot
        description: Time-of-day category from the `visit_time_of_day` macro.
      - name: total_visits
        description: Count of feedback records for this house and time slot.
        data_tests:
          - not_null
      - name: total_revenue
        description: Sum of `ticket_price` for feedback records in this combination.
      - name: avg_ticket_price
        description: Average ticket price for this combination.
      - name: avg_satisfaction
        description: Average satisfaction rating for this house and time slot.
        data_tests:
          - not_null
      - name: recommendation_rate
        description: Percentage of visitors who would recommend this house in this time slot.
        data_tests:
          - not_null

  - name: agg_ticket_value
    description: Value analysis comparing ticket tiers within each haunted house.
    columns:
      - name: haunted_house_name
        description: Display name of the haunted house.
        data_tests:
          - not_null
      - name: ticket_tier
        description: Ticket benefit tier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VIP + Fast Pass', 'VIP Only', 'Fast Pass Only', 'Standard']
      - name: avg_satisfaction
        description: Average satisfaction rating for this house and ticket tier.
        data_tests:
          - not_null
      - name: avg_price
        description: Average ticket price for this house and ticket tier.
      - name: visit_count
        description: Number of feedback records for this house and ticket tier.
        data_tests:
          - not_null
      - name: value_index
        description: "avg_satisfaction / avg_price * 100"
      - name: value_rank
        description: Rank by `value_index` descending.
        data_tests:
          - not_null

  - name: agg_vip_satisfaction
    description: Comparison of satisfaction levels between VIP and non-VIP visitors per haunted house.
    columns:
      - name: haunted_house_name
        description: Display name of the haunted house.
        data_tests:
          - not_null
      - name: is_vip
        description: TRUE for VIP visitors.
      - name: avg_satisfaction
        description: Average satisfaction rating for this house and VIP status.
        data_tests:
          - not_null
      - name: satisfaction_gap
        description: "vip_avg_satisfaction - non_vip_avg_satisfaction for this house"

  - name: agg_visitor_recommendations
    description: Recommendation rate and NPS segmentation by visitor type.
    columns:
      - name: visitor_type
        description: Feedback category used as visitor type proxy.
        data_tests:
          - unique
          - not_null
      - name: recommendation_rate
        description: Percentage of visitors in this type who would recommend.
        data_tests:
          - not_null
      - name: total_visits
        description: Count of feedback records for this visitor type.
        data_tests:
          - not_null
      - name: nps_segment
        description: NPS classification based on recommendation rate.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Promoter', 'Passive', 'Detractor']
      - name: promoter_rank
        description: Rank by recommendation_rate descending.
        data_tests:
          - not_null
