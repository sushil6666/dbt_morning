version: 2

# ═════════════════════════════════════════════════════════════════════════════
# SAVED QUERIES — Theme Park Platform
# ═════════════════════════════════════════════════════════════════════════════
#
# ── THE PROBLEM SAVED QUERIES SOLVE ──────────────────────────────────────────
#
# When a BI analyst connects to the dbt Semantic Layer API, they face two problems:
#
#   1. DISCOVERY PROBLEM: The semantic layer exposes 25+ metrics and 40+ dimensions.
#      Which combinations are meaningful? Slicing food_revenue by haunted_house_name
#      makes no sense (no entity relationship), but nothing stops an analyst from trying.
#      They get NULL or empty results and conclude the data is broken.
#
#   2. PERFORMANCE PROBLEM: Some metric × dimension combinations require MetricFlow
#      to join multiple semantic models across large tables. If a BI tool queries these
#      combinations naively on every page load, dashboards will be slow.
#
# ── WHAT SAVED QUERIES DO ────────────────────────────────────────────────────
#
# Saved queries are pre-approved, semantically-validated, performance-tested
# metric + dimension combinations. They appear in BI tools as:
#   - Tableau:     Named Published Data Sources
#   - Hex:         Named Metric Views in the Metrics Explorer
#   - Mode:        Semantic Query Templates
#   - Looker:      Refinements fed by the Semantic Layer JDBC driver
#
# Each saved query represents an answer to a specific business question that
# the data team and stakeholders have agreed is valid and useful. By defining
# them here, they are:
#
#   ✓ Code-reviewed   — same PR process as all other dbt code
#   ✓ Version-controlled — change history and rollback available
#   ✓ Documented      — the description field explains what business question
#                       this answers and who it is for
#   ✓ Tested          — `mf validate-configs` checks all referenced metrics/dims
#   ✓ Lineage-tracked — exposures in platform/models/exposures.yml reference
#                       these saved queries, so the dbt DAG shows what BI tools
#                       depend on what data
#
# ── HOW SAVED QUERIES RELATE TO EXPOSURES ────────────────────────────────────
#
# Each BI tool that consumes a saved query has a corresponding exposure in
# platform/models/exposures.yml. The exposure:
#   - Declares which metrics the BI tool depends on (impact analysis)
#   - Documents who owns the downstream consumer and what SLA it has
#   - Enables `dbt run --select +exposure:my_dashboard` to build only the
#     upstream models needed for that specific dashboard
#
# ── NAMING CONVENTION ────────────────────────────────────────────────────────
#
#   sq_<domain>_<description>
#
# ── HOW TO USE ───────────────────────────────────────────────────────────────
#
#   # Run a saved query via CLI
#   mf query --saved-query sq_daily_revenue_trend
#
#   # Run with a date filter
#   mf query --saved-query sq_daily_revenue_trend --start-time 2025-01-01
#
#   # List all available saved queries
#   mf list saved-queries
#
# ═════════════════════════════════════════════════════════════════════════════

saved_queries:

  # ── Daily Revenue Trend ────────────────────────────────────────────────────
  - name: sq_daily_revenue_trend
    label: "Daily Revenue Trend"
    description: >
      Pre-approved query for revenue trend dashboards. Returns all major revenue
      streams broken down by calendar day.

      WHO THIS IS FOR:
        Finance team (daily close reporting), Executive team (morning briefings),
        Operations team (same-day performance vs prior period).

      WHY THIS SAVED QUERY EXISTS:
        The daily revenue dashboard is the most-loaded dashboard in the BI platform —
        it runs on every Finance team member's morning login and feeds the 07:00 briefing.
        Using the pre-aggregated sm_daily_revenue semantic model means MetricFlow generates
        a simple SELECT + GROUP BY against fct_daily_revenue (one row per day) rather than
        scanning full fact table grains. This is the difference between a 200ms load and
        a 12-second load for a two-year date range.

      WHY THIS DIMENSION SET:
        Time-only grouping by design. Adding customer or ticket dimensions would force
        MetricFlow to join sm_daily_revenue (no FK entities) to other models, which is
        not supported — fct_daily_revenue is pre-aggregated and customer-level linkage
        is gone. For dimensional revenue breakdown, use sq_revenue_by_customer_segment.

      UPSTREAM DATA:
        fct_daily_revenue → sm_daily_revenue semantic model.

      REFERENCED BY:
        exposure: semantic_layer_daily_revenue_dashboard (platform/models/exposures.yml)
    query_params:
      metrics:
        - total_daily_revenue
        - food_revenue
        - merch_revenue
        - unique_daily_visitors
        - tickets_sold
      group_by:
        - "TimeDimension('fct_daily_revenue__revenue_date', 'DAY')"

  # ── Revenue by Customer Segment ────────────────────────────────────────────
  - name: sq_revenue_by_customer_segment
    label: "Revenue by Customer Segment"
    description: >
      Pre-approved query for customer segmentation performance analysis. Returns
      visit revenue and satisfaction metrics grouped by the four primary customer
      segmentation dimensions.

      WHO THIS IS FOR:
        Guest Services team (loyalty programme management), Growth team (segment
        targeting), Marketing team (campaign audience sizing).

      WHY THIS SAVED QUERY EXISTS:
        Before the semantic layer, "revenue by loyalty tier" lived only inside
        agg_customer_lifetime_value — and that model rolled up CLV, not period revenue.
        Getting period-specific revenue by loyalty tier required building a new model.
        This saved query makes that standard analyst workflow available immediately,
        without new SQL.

        The is_vip_member cut is specifically requested by the Guest Services team
        every quarter to validate that the VIP programme generates higher revenue per
        visit than the cost of VIP benefits. This query is the standard vehicle for
        that analysis.

      HOW METRICFLOW RESOLVES THIS:
        MetricFlow joins sm_visits → sm_customers via the shared `customer` entity.
        The join uses customer_id as the key. No manual JOIN required.

      WHY THESE FOUR DIMENSIONS:
        loyalty_tier           → programme tier comparison (Bronze vs Platinum)
        is_vip_member          → VIP programme ROI validation
        customer_value_segment → revenue-based segmentation (High/Mid/Low Value)
        customer_lifecycle_stage → churn risk context (New vs At Risk vs Lapsed)

      UPSTREAM DATA:
        fct_visits → sm_visits (fact grain)
        dim_customers → sm_customers (customer attributes, joined via entity)

      REFERENCED BY:
        exposure: semantic_layer_customer_insights (platform/models/exposures.yml)
    query_params:
      metrics:
        - total_visits
        - ticket_revenue
        - in_park_spend
        - total_visit_spend
        - avg_visit_rating
        - revenue_per_visit
      group_by:
        - "Dimension('dim_customers__loyalty_tier')"
        - "Dimension('dim_customers__is_vip_member')"
        - "Dimension('dim_customers__customer_value_segment')"
        - "Dimension('dim_customers__customer_lifecycle_stage')"

  # ── Ticket Sales by Channel ────────────────────────────────────────────────
  - name: sq_ticket_channel_analysis
    label: "Ticket Sales by Channel"
    description: >
      Pre-approved query for purchase channel and promotional analysis. Returns
      ticket volume, revenue, and discount depth by channel, season, booking lead
      time, and discount category.

      WHO THIS IS FOR:
        Marketing team (channel ROI, promotional effectiveness), Revenue Management
        team (pricing strategy, advance booking forecasting).

      WHY THIS SAVED QUERY EXISTS:
        Channel analysis was entirely missing from the analytics project before the
        semantic layer. agg_halloween_spending captured discount information but only
        during Halloween season. agg_daily_revenue had no channel dimension at all.
        Marketing needed to write ad-hoc SQL against fct_all_ticket_sales every time
        they wanted to answer "which channel sells the most tickets?" — a question they
        ask every week.

        This saved query standardises that analysis and ensures everyone uses the same
        metric definitions (avg_ticket_price = actual price paid, avg_discount_rate =
        average % off list price) rather than building slightly different calculations
        in spreadsheets.

      WHY THESE DIMENSIONS:
        purchase_channel   → web, mobile, kiosk, box office — channel mix analysis
        business_season    → seasonal pattern without needing date range filters
        is_advance_purchase → advance vs same-day bookings — lead time analysis
        discount_category  → Early Bird, Group Rate, Promo Code — promotion type ROI

      KEY INSIGHT THIS ENABLES:
        Compare avg_discount_rate across purchase_channel to identify which channels
        depend most on discounting. If online channel has high avg_discount_rate but
        also high ticket_sale_count, promotional pricing may be working. If kiosk has
        similar avg_discount_rate but lower volume, the discount is not pulling volume.

      UPSTREAM DATA:
        fct_all_ticket_sales → sm_ticket_sales (purchase grain)

      REFERENCED BY:
        exposure: semantic_layer_marketing_channel_analysis (platform/models/exposures.yml)
    query_params:
      metrics:
        - ticket_sale_count
        - ticket_revenue_vs_face_value
        - avg_ticket_price
        - avg_discount_rate
      group_by:
        - "Dimension('fct_all_ticket_sales__purchase_channel')"
        - "Dimension('fct_all_ticket_sales__business_season')"
        - "Dimension('fct_all_ticket_sales__is_advance_purchase')"
        - "Dimension('fct_all_ticket_sales__discount_category')"

  # ── Haunted House Performance ──────────────────────────────────────────────
  - name: sq_haunted_house_performance
    label: "Haunted House Performance"
    description: >
      Pre-approved query for haunted house attraction performance analysis.
      Returns revenue, ticket volume, and satisfaction by house and fear level.

      WHO THIS IS FOR:
        Haunted Attractions team (programming decisions), Operations team (capacity
        planning), Finance team (seasonal revenue attribution).

      WHY THIS SAVED QUERY EXISTS:
        The haunted house analytics dashboard previously required four separate agg_*
        models in the analytics project: agg_happiest_houses, agg_fear_vs_ratings,
        agg_vip_satisfaction, agg_visitor_recommendations. Each answered one specific
        question. The Haunted Attractions team routinely asked new questions that
        weren't covered — for example, "which house generates the most revenue per
        ticket sold, broken down by fear level?" — and engineers had to write new models.

        This saved query covers the core house × fear level performance matrix in one
        query. It combines revenue metrics (from sm_haunted_tickets) with satisfaction
        metrics (from sm_visitor_feedback) — note that these are from different semantic
        models that do NOT share an entity join. MetricFlow queries them in separate passes
        and aligns results on the shared dimensions (haunted_house_name, fear_level).

      NOTE ON METRIC SOURCE ALIGNMENT:
        haunted_ticket_revenue, haunted_ticket_count → from sm_haunted_tickets (ticket grain)
        avg_satisfaction_rating, total_feedback_responses → from sm_visitor_feedback (feedback grain)
        MetricFlow does not join these two models — it queries each independently and
        aligns results on the group-by dimensions. This is correct behaviour: ticket revenue
        and satisfaction come from different data collection processes.

      WHY THESE DIMENSIONS:
        haunted_house_name  → which house (primary product identifier)
        fear_level          → fear intensity tier (product differentiation axis)

        The combination of these two dimensions produces a revenue × satisfaction matrix
        that the Haunted Attractions team uses to decide which houses to expand, retire,
        or reposition in the seasonal lineup.

      UPSTREAM DATA:
        fct_haunted_house_tickets → sm_haunted_tickets
        fct_haunted_visitor_feedback → sm_visitor_feedback

      REFERENCED BY:
        exposure: semantic_layer_haunted_house_analytics (platform/models/exposures.yml)
    query_params:
      metrics:
        - haunted_ticket_revenue
        - haunted_ticket_count
        - avg_satisfaction_rating
        - total_feedback_responses
      group_by:
        - "Dimension('fct_haunted_house_tickets__haunted_house_name')"
        - "Dimension('fct_haunted_house_tickets__fear_level')"

  # ── Customer Satisfaction by Visitor Segment ───────────────────────────────
  - name: sq_satisfaction_by_visitor_segment
    label: "Satisfaction by Visitor Segment"
    description: >
      Pre-approved query for visitor satisfaction and NPS analysis by visitor type,
      house, and recommendation intent.

      WHO THIS IS FOR:
        Guest Experience team (CX improvement prioritisation), Marketing team (NPS
        and word-of-mouth strategy), Haunted Attractions team (targeted experience
        improvement).

      WHY THIS SAVED QUERY EXISTS:
        The existing agg_visitor_recommendations model in the analytics project
        provides NPS segmentation at the aggregate level — total Promoters vs Detractors.
        It does not allow slicing by haunted_house_name or visitor_type simultaneously.
        Guest Services regularly asks: "Among first-time visitors who visited Nightmare Manor,
        what fraction would recommend?" — a question that required manual SQL before this
        saved query.

        The would_recommend dimension (the NPS proxy) enables recommendation rate calculation:
        query total_feedback_responses grouped by would_recommend, then compute
        count(would_recommend='true') / count(*) in your BI layer. This is more flexible
        than pre-computing a fixed recommendation rate percentage in a SQL model.

      NOTE — NO CUSTOMER ENTITY ON THIS MODEL:
        sm_visitor_feedback has no customer FK entity (sale_id linkage is nullable —
        many survey respondents are anonymous). This query cannot be sliced by loyalty_tier
        or VIP status. For loyalty-tier-linked satisfaction, use avg_visit_rating from
        sq_revenue_by_customer_segment, which does have the customer join.

      WHY THESE DIMENSIONS:
        visitor_type        → first-time vs returning (expectation vs novelty split)
        haunted_house_name  → house-level satisfaction comparison
        fear_level          → fear intensity alignment with visitor expectation
        would_recommend     → NPS proxy (self-selected promotion vs detraction intent)

      UPSTREAM DATA:
        fct_haunted_visitor_feedback → sm_visitor_feedback

      REFERENCED BY:
        exposure: semantic_layer_visitor_satisfaction (platform/models/exposures.yml)
    query_params:
      metrics:
        - avg_satisfaction_rating
        - total_feedback_responses
      group_by:
        - "Dimension('fct_haunted_visitor_feedback__visitor_type')"
        - "Dimension('fct_haunted_visitor_feedback__haunted_house_name')"
        - "Dimension('fct_haunted_visitor_feedback__fear_level')"
        - "Dimension('fct_haunted_visitor_feedback__would_recommend')"

  # ── Visits and Spend by Geography ─────────────────────────────────────────
  - name: sq_visits_by_geography
    label: "Visits and Spend by Geography"
    description: >
      Pre-approved query for geographic draw analysis — where are visitors travelling
      from, and does distance correlate with spend or visit frequency?

      WHO THIS IS FOR:
        Marketing team (regional campaign allocation, billboard and OOH planning),
        Strategy team (catchment area analysis, expansion feasibility).

      WHY THIS SAVED QUERY EXISTS:
        Geographic analysis was entirely absent from the analytics project — no agg_*
        model carried a state or city dimension. Marketing was exporting raw customer
        data to spreadsheets to do regional analysis, with no standardised metric
        definitions and no version control on the calculations.

        This saved query provides a consistent, code-reviewed geographic breakdown
        for the standard marketing questions: "Which states are our best markets? Are
        distant customers (out-of-state) spending more per visit (making a day out of it)
        or less (more price-sensitive)?"

        The loyalty_tier cut within geography reveals whether certain markets skew
        toward high-loyalty customers — useful for tailoring regional communications.

      HOW METRICFLOW RESOLVES THIS:
        Joins sm_visits → sm_customers via the `customer` entity, then groups by
        sm_customers__state and sm_customers__loyalty_tier. MetricFlow generates
        a JOIN between fct_visits and dim_customers on customer_id automatically.

      UPSTREAM DATA:
        fct_visits → sm_visits
        dim_customers → sm_customers (joined via customer entity)

      REFERENCED BY:
        exposure: semantic_layer_geographic_analysis (platform/models/exposures.yml)
    query_params:
      metrics:
        - total_visits
        - ticket_revenue
        - total_visit_spend
        - distinct_visiting_customers
      group_by:
        - "Dimension('dim_customers__state')"
        - "Dimension('dim_customers__loyalty_tier')"

  # ── Weekend vs Weekday Performance ────────────────────────────────────────
  - name: sq_weekend_vs_weekday
    label: "Weekend vs Weekday Performance"
    description: >
      Pre-approved query for day-type performance comparison, used for staffing
      models and capacity planning.

      WHO THIS IS FOR:
        Operations team (staffing allocation, maintenance scheduling), Finance team
        (revenue concentration risk assessment — what percentage of revenue comes
        from just 2 of 7 days?).

      WHY THIS SAVED QUERY EXISTS:
        Weekends typically generate 60–70% of weekly visit volume at theme parks.
        This creates staffing and maintenance scheduling tension: schedule heavy
        maintenance on weekends and you lose revenue; schedule it on weekdays and
        staff idle time increases. Operations needs a clean, weekly view of how
        revenue and satisfaction differ between weekend and weekday days — and
        how that difference changes by month (is the weekday/weekend gap larger
        in summer or during Halloween season?).

        Before this saved query, answering that question required filtering fct_visits
        on is_weekend and building a pivot table manually. This query provides it
        as a first-class, always-current metric view.

      WHY THE MONTHLY GRAIN:
        The monthly time grain reveals seasonal variation in the weekday/weekend split.
        During Halloween Season, weekday evenings may see unusually high haunted house
        demand from adults (as opposed to family-oriented weekend crowds). Monthly
        grouping surfaces this pattern; daily grouping is too noisy.

      UPSTREAM DATA:
        fct_visits → sm_visits

      REFERENCED BY:
        exposure: semantic_layer_operations_planning (platform/models/exposures.yml)
    query_params:
      metrics:
        - total_visits
        - ticket_revenue
        - in_park_spend
        - avg_visit_rating
      group_by:
        - "Dimension('fct_visits__is_weekend')"
        - "Dimension('fct_visits__day_of_week')"
        - "TimeDimension('fct_visits__visit_date', 'MONTH')"
