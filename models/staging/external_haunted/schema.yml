version: 2

models:

  - name: stg_external_haunted__haunted_houses
    description: >
      Staged haunted house dimension records, derived from `RAW.raw_rides` filtered
      to `is_haunted = TRUE`. One row per haunted house. Grain is `haunted_house_id`.

      `ride_id` is cast to integer and aliased as `haunted_house_id`. `thrill_level`
      is converted to a numeric `fear_level` (1–5) using the standard mapping.
      See `{{ doc('fear_level_mapping') }}` for the full mapping table.

      This model is the reference dimension for all haunted house analytics.
      It feeds `fct_haunted_house_tickets` and all `agg_*` haunted models.

      Owner: operations@themeparkanalytics.com
    columns:
      - name: haunted_house_id
        description: >
          Integer primary key for a haunted house. Sourced from `raw_rides.ride_id`
          cast to integer. Use for joins from ticket and feedback models.
        data_tests:
          - unique
          - not_null

      - name: haunted_house_name
        description: >
          Display name of the haunted house, sourced from `raw_rides.ride_name`.
          Treated as a business key — should be unique within the haunted house set.
        data_tests:
          - unique
          - not_null

      - name: capacity
        description: >
          Maximum number of visitors the haunted house can process per hour, sourced
          from `raw_rides.capacity_per_hour` cast to integer. Used for utilisation
          calculations in profitability analytics.
        data_tests:
          - not_null

      - name: fear_level
        description: "{{ doc('fear_level_mapping') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2, 3, 4, 5]


  - name: stg_external_haunted__haunted_house_tickets
    description: >
      Staged haunted house ticket sales, derived from `RAW.raw_tickets`. One row per
      ticket-to-haunted-house assignment. Grain is `ticket_id`.

      Because `raw_tickets` has no `haunted_house_id` column, tickets are assigned to
      haunted houses **deterministically** using:
        `MOD(ticket_id - 1, number_of_haunted_houses) + 1`

      This distributes tickets evenly across all haunted houses by round-robin assignment,
      which is an approximation for analytical purposes. Do not treat these assignments
      as ground-truth visit records — they are inferred, not recorded.

      `ticket_price` is sourced from `raw_tickets.final_price` (amount actually paid).

      Owner: operations@themeparkanalytics.com
    columns:
      - name: ticket_id
        description: >
          Natural primary key for the ticket record, sourced from `raw_tickets.ticket_id`.
          Varchar. Unique — each ticket is assigned to exactly one haunted house.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Foreign key to `stg_customer_data__customers.customer_id`. Identifies the
          visiting customer.
        data_tests:
          - not_null

      - name: haunted_house_id
        description: >
          Foreign key to `stg_external_haunted__haunted_houses.haunted_house_id`.
          Assigned deterministically by round-robin distribution — not recorded at
          point of sale. See model description for the assignment formula.
        data_tests:
          - not_null

      - name: visit_date
        description: >
          Date the ticket is valid for (YYYY-MM-DD). Sourced from `raw_tickets.visit_date`.
          Use for time-series and seasonal analysis of haunted house visits.

      - name: ticket_price
        description: >
          Amount the customer paid for the ticket in USD, sourced from
          `raw_tickets.final_price`, cast to `numeric(10,2)`. This is the revenue
          measure for haunted house ticket analytics.
        data_tests:
          - not_null

      - name: created_at
        description: >
          Timestamp of the ticket purchase, sourced from `raw_tickets.purchase_date::timestamp`.
          Represents when the ticket was bought, not when the visit occurred.

      - name: updated_at
        description: >
          Set equal to `created_at` (purchase_date::timestamp). The raw source carries no
          separate update timestamp for ticket records.


# ---------------------------------------------------------------------------
# Unit Tests
# ---------------------------------------------------------------------------

unit_tests:

  # ── stg_external_haunted__haunted_houses: WHERE is_haunted = true ─────────
  - name: test_is_haunted_filter
    model: stg_external_haunted__haunted_houses
    description: >
      Verifies that WHERE is_haunted = true excludes non-haunted rides.
      Two rows in, one row out — only the haunted ride must appear in output.
      Also confirms thrill_level 'extreme' maps to fear_level 5.
    given:
      - input: source('external_haunted', 'haunted_houses')
        rows:
          - {ride_id: 1, ride_name: 'Dungeon of Doom', thrill_level: 'extreme',
             is_haunted: true,  capacity_per_hour: 200}
          - {ride_id: 2, ride_name: 'Water Splash',    thrill_level: 'medium',
             is_haunted: false, capacity_per_hour: 300}
    expect:
      rows:
        - {haunted_house_id: 1, haunted_house_name: 'Dungeon of Doom', fear_level: 5}
